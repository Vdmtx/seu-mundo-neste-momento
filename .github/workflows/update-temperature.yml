name: Atualizar temperatura NOAA GFS
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update-temperature.py'
      - 'scripts/requirements-temperature.txt'
      - '.github/workflows/update-temperature.yml'
  schedule:
    # O f000 normalmente já está disponível algumas horas após 00/06/12/18 UTC.
    - cron: '25 4,10,16,22 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  temperature:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-temperature.txt
      - name: Preparar leitor GRIB e gerador da textura
        run: python -m pip install --disable-pip-version-check -r scripts/requirements-temperature.txt
      - name: Baixar somente temperatura do ar a 2 m
        run: python scripts/update-temperature.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Atualizar snapshot público
        run: node scripts/update-data.mjs
      - name: Bloquear publicação inconsistente
        run: REQUIRE_GENERATED_SNAPSHOT=1 node scripts/validate-site.mjs
      - name: Persistir rodada e textura
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/temperature.json
          if [ -f data/temperature-globe.webp ]; then git add data/temperature-globe.webp; fi
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar textura térmica NOAA GFS"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
