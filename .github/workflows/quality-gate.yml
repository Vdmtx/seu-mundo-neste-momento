name: Validar estabilidade do site
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar código, interface, traduções e dados
        run: node scripts/validate-site.mjs
      - name: Validar automação térmica
        run: python -m py_compile scripts/update-temperature.py
