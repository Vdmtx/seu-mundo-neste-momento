name: Atualizar dados públicos
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: live-data
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-data.mjs
      - name: Publicar somente quando os dados mudarem
        run: |
          if git diff --quiet -- data/snapshot.json; then exit 0; fi
          git config user.name "seu-mundo-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/snapshot.json
          git commit -m "Atualizar snapshot público"
          git push
