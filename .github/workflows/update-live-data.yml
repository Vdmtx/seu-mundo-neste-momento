name: Atualizar dados e publicar GitHub Pages
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/temperature.json'
      - 'data/temperature-globe.webp'
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  # A deployment already in progress must finish; cancelling it can leave the
  # Pages environment locked and make the next deployment fail with HTTP 400.
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-data.mjs
      - name: Bloquear publicação inconsistente
        run: node scripts/validate-site.mjs
      - name: Persistir grade térmica quando houver nova rodada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/temperature.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar grade térmica NOAA GFS"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
